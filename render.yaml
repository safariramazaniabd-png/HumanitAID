services:
  - type: web
    name: humanitaid
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DEMO_MODE
        value: "false"
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: humanitaid-db
          property: connectionString
      - key: CORS_ORIGIN
        sync: false
      - key: SITE_URL
        sync: false
      - key: ADMIN_URL
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: FLUTTERWAVE_SECRET_KEY
        sync: false
      - key: FLUTTERWAVE_PUBLIC_KEY
        sync: false
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: PAYSTACK_PUBLIC_KEY
        sync: false
      - key: EMAIL_API_KEY
        sync: false
      - key: EMAIL_FROM
        value: noreply@humanit-aid.org
      - key: STORAGE_PROVIDER
        value: local
      - key: UPLOAD_MAX_SIZE_MB
        value: "10"

databases:
  - name: humanitaid-db
    plan: starter
    databaseName: humanitaid
    user: humanitaid
