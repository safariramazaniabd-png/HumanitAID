name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Check JS syntax (backend)
        run: |
          for f in backend/**/*.js backend/*.js; do
            if [ -f "$f" ]; then
              node --check "$f" || echo "SYNTAX ERROR in $f"
            fi
          done

      - name: Check JS syntax (frontend)
        run: |
          for f in frontend/js/*.js; do
            if [ -f "$f" ]; then
              node --check "$f" || echo "SYNTAX ERROR in $f"
            fi
          done

      - name: Check JS syntax (admin)
        run: |
          for f in admin/js/*.js; do
            if [ -f "$f" ]; then
              node --check "$f" || echo "SYNTAX ERROR in $f"
            fi
          done

      - name: Verify server starts
        run: |
          node backend/server.js &
          SERVER_PID=$!
          sleep 3
          curl -sf http://localhost:3000/api/health || exit 1
          kill $SERVER_PID || true

      - name: Secret scan
        run: |
          if grep -rn 'sk_live\|sk_test\|password.*=.*admin' --include='*.js' --include='*.html' --exclude-dir=node_modules --exclude='*.env*' --exclude='schema.sql' --exclude='README.md' --exclude='DEPLOYMENT.md' --exclude='PRODUCTION_CHECKLIST.md' .; then
            echo "⚠ Potential secrets found in source code"
          fi

  build-verify:
    runs-on: ubuntu-latest
    needs: lint-and-verify
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Verify all files exist
        run: |
          test -f frontend/index.html || exit 1
          test -f admin/index.html || exit 1
          test -f backend/server.js || exit 1
          test -f database/schema.sql || exit 1
          test -f .env.example || exit 1
          test -f render.yaml || exit 1
          echo "All critical files present"

      - name: Verify no hardcoded secrets
        run: |
          ! grep -rn 'sk_live' frontend/ admin/ backend/routes/ backend/middleware/ --include='*.js' --include='*.html' 2>/dev/null
          echo "No live Stripe keys found in source"
